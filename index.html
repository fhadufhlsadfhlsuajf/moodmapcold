<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>冷酷值计算器 - 极简版</title>
<style>
  /* 极简白底黑字 */
  body { background:#fff; color:#000; font-family:system-ui,sans-serif; max-width:640px; margin:40px auto; padding:0 16px; line-height:1.5; }
  h2 { border-bottom:1px solid #000; padding-bottom:8px; }
  .box { border:1px solid #000; padding:12px; margin:12px 0; }
  input, button { border:1px solid #000; background:#fff; color:#000; padding:8px 12px; font-size:15px; box-sizing:border-box; }
  input { width:100%; margin-bottom:8px; }
  button { cursor:pointer; margin-right:8px; margin-bottom:8px; }
  button:hover { background:#000; color:#fff; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  .img-box { margin-top:12px; display:none; border:1px solid #000; padding:4px; }
  img { width:100%; display:block; filter:grayscale(20%); } /* 微灰度契合冷感，可删 */
  table { width:100%; font-size:14px; border-collapse:collapse; margin-top:8px; }
  td { border-bottom:1px solid #ccc; padding:4px 0; }
  td:last-child { text-align:right; }
  .warn { font-size:13px; margin-top:8px; min-height:20px; }
</style>
</head>
<body>

<h2>冷酷值计算器</h2>

<div class="box">
  <input id="place" placeholder="输入地点/坐标，如: 22.359944,114.102944 或 Bergen Nordnes" />
  <div class="row">
    <input id="hh" type="number" min="0" max="23" value="21" placeholder="时">
    <input id="mm" type="number" min="0" max="59" value="0" placeholder="分">
  </div>
  <div class="row">
    <input id="temp" type="number" value="12" placeholder="气温℃">
    <input id="wind" type="number" value="7.2" placeholder="风速km/h">
    <input id="wcode" type="number" value="61" placeholder="天气码">
  </div>
  <button id="calc">仅计算</button>
  <button id="geoBtn">联网查天气+图</button>
  <div class="warn" id="warn"></div>
</div>

<div class="box" id="resBox" style="display:none">
  <div id="resText" style="font-weight:700;font-size:20px;margin-bottom:8px"></div>
  <div id="resTable"></div>
  <div id="imgWrap" class="img-box">
    <img id="placeImg" alt="地点实景" />
  </div>
</div>

<script>
// --- 核心算法 (沿用前文逻辑，微调视觉修正) ---
const PRESET = {
  "担杆山交匯處":{lat:22.359944,lon:114.102944,tags:["环岛","工业","冷感"],name:"担杆山交汇处"},
  "担杆山交汇处":{lat:22.359944,lon:114.102944,tags:["环岛","工业","冷感"],name:"担杆山交汇处"},
  "tam kon shan interchange":{lat:22.359944,lon:114.102944,tags:["环岛","工业","冷感"],name:"担杆山交汇处"},
  "bergen-nordnes":{lat:60.398433,lon:5.304174,tags:["滨水","木屋","雾港","北欧"],name:"Bergen Nordnes"},
  "nordnes":{lat:60.398433,lon:5.304174,tags:["滨水","木屋","雾港","北欧"],name:"Bergen Nordnes"}
};

async function resolvePlace(raw){
  const key = raw.toLowerCase().trim();
  if(PRESET[key]) return {...PRESET[key], via:"预设"};
  if(/^-?\d+\.\d+,\s*-?\d+\.\d+$/.test(raw)){
    const [lat,lon]=raw.split(",").map(Number); return {lat,lon,tags:[],name:raw,via:"坐标"};
  }
  // Nominatim 兜底
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(raw)}&format=json&limit=1`;
  const r = await fetch(url, {headers:{"User-Agent":"cold-index/1.0"}});
  const j = await r.json();
  if(!j.length) throw new Error("搜不到地点，建议输坐标");
  return {lat:+j[0].lat, lon:+j[0].lon, tags:[], name:j[0].display_name.split(",")[0], via:"Nominatim"};
}

function sunAlt(lat, lon, date){
  // 简化太阳高度角 (足够冷酷值使用)
  const d = date.getUTCDate(), m = date.getUTCMonth()+1;
  const n = m<3?365+m:d+(m<13?0:30);
  const gamma = 2*Math.PI*(n-1)/365;
  const decl = 23.44*Math.sin(gamma);
  const hour = date.getUTCHours() + date.getUTCMinutes()/60 + lon/15;
  const hra = 15*(hour-12);
  const latR = lat*Math.PI/180, declR=decl*Math.PI/180, hraR=hra*Math.PI/180;
  const sinAlt = Math.sin(latR)*Math.sin(declR)+Math.cos(latR)*Math.cos(declR)*Math.cos(hraR);
  return Math.asin(sinAlt)*180/Math.PI;
}

function scoreTime(alt){ return Math.max(0, Math.min(80, 80 - (alt+12)*(72/22))); }

function scoreGeo(tags, lat){
  let r=30, w=20;
  if(tags.some(t=>["环岛","工业","废堡","离岛"].includes(t))) r+=20;
  if(tags.some(t=>["闹市","旺角"].includes(t))) r-=15;
  if(tags.some(t=>["雾港","北欧","滨水"].includes(t))) w+=10;
  return r*0.6 + w*0.4;
}

function scoreWeather(temp, wind, code){
  let s = 10;
  s += Math.min(30, Math.max(0, (24-temp)*2.2));
  s += Math.min(20, Math.max(0, (wind-5)*0.9));
  if([61,63,65,80,81,82].includes(code)) s+=14;
  else if([45,48].includes(code)) s+=10;
  else if([95,96,99].includes(code)) s+=18;
  return Math.min(80, s);
}

function scoreCulture(tags, name){
  let s = 30;
  if(/环岛|交匯|交汇/.test(name)) s+=18;
  if(tags.includes("工业")) s+=12;
  if(tags.includes("雾港")) s+=15;
  if(tags.includes("北欧")) s+=8;
  if(tags.includes("滨水")) s+=6;
  return Math.min(80, s);
}

// --- 天气/图片联网 ---
async function fetchWeather(lat,lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("天气HTTP"+r.status);
  const j = await r.json();
  return { temp:j.current.temperature_2m, wind:j.current.wind_speed_10m, code:j.current.weather_code, time:j.current.time };
}

async function fetchPlaceImg(query){
  // 使用 Unsplash 免费源 (按关键词，无需Key，但限流)
  const url = `https://source.unsplash.com/1200x800/?${encodeURIComponent(query+", landscape, city")}`;
  return url; // 直接返回URL，img标签加载，失败则隐藏
}

// --- 渲染 ---
async function buildCtx(raw, net){
  const place = await resolvePlace(raw);
  let w = {temp:+document.getElementById('temp').value, wind:+document.getElementById('wind').value, code:+document.getElementById('wcode').value, src:"手动"};
  if(net){
    try{
      const nw = await fetchWeather(place.lat, place.lon);
      w = {...nw, src:"Open-Meteo "+nw.time};
      document.getElementById('temp').value=nw.temp; document.getElementById('wind').value=nw.wind;
    }catch(e){ document.getElementById('warn').textContent = "⚠ 天气联网失败："+e.message+"，已用手动值"; }
    // 图片
    try{
      const imgUrl = await fetchPlaceImg(place.name || raw);
      const imgEl = document.getElementById('placeImg');
      imgEl.onerror = ()=>document.getElementById('imgWrap').style.display='none';
      imgEl.src = imgUrl;
      document.getElementById('imgWrap').style.display='block';
    }catch(e){ document.getElementById('imgWrap').style.display='none'; }
  }else{
    document.getElementById('imgWrap').style.display='none';
  }
  return {place, w};
}

function render(ctx, h, m){
  const date = new Date(); date.setHours(h, m,0,0);
  const alt = sunAlt(ctx.place.lat, ctx.place.lon, date);
  const sT = scoreTime(alt), sG = scoreGeo(ctx.place.tags, ctx.place.lat);
  const sW = scoreWeather(ctx.w.temp, ctx.w.wind, ctx.w.code), sC = scoreCulture(ctx.place.tags, ctx.place.name);
  const total = sT*0.3 + sG*0.25 + sW*0.25 + sC*0.2;
  let mood = total<40?"普通偏冷":total<55?"冷感显著":total<70?"压抑空旷":"极致荒寒";
  
  document.getElementById('resBox').style.display='block';
  document.getElementById('resText').innerHTML = `${ctx.place.name} · ${total.toFixed(1)} <span style="font-size:14px">/100 · ${mood}</span>`;
  document.getElementById('resTable').innerHTML = `
    <table>
      <tr><td>时间光照(太阳高度${alt.toFixed(1)}°)</td><td>${sT.toFixed(1)}×30%</td></tr>
      <tr><td>地理人口</td><td>${sG.toFixed(1)}×25%</td></tr>
      <tr><td>天气体感(${ctx.w.temp}℃ ${ctx.w.wind}km/h code${ctx.w.code})</td><td>${sW.toFixed(1)}×25%</td></tr>
      <tr><td>文化心理</td><td>${sC.toFixed(1)}×20%</td></tr>
      <tr><td colspan="2" style="border:0;font-size:12px;opacity:.7">来源:${ctx.w.src} | 解析:${ctx.place.via}</td></tr>
    </table>`;
}

// --- 事件 ---
document.getElementById('calc').onclick = async ()=>{
  document.getElementById('warn').textContent='';
  const raw = document.getElementById('place').value.trim(); if(!raw){document.getElementById('warn').textContent='先输地点';return;}
  try{ const ctx = await buildCtx(raw,false); render(ctx, +document.getElementById('hh').value, +document.getElementById('mm').value); }
  catch(e){ document.getElementById('warn').textContent=e.message; }
};
document.getElementById('geoBtn').onclick = async ()=>{
  document.getElementById('warn').textContent='';
  const raw = document.getElementById('place').value.trim(); if(!raw){document.getElementById('warn').textContent='先输地点';return;}
  try{ const ctx = await buildCtx(raw,true); render(ctx, +document.getElementById('hh').value, +document.getElementById('mm').value); }
  catch(e){ document.getElementById('warn').textContent=e.message; }
};
document.getElementById('place').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('calc').click()});
</script>
</body>
</html>
